    // Uses a data: URI (instead of a Blob/ObjectURL) so it works reliably
    // across browsers/hosts, and always resolves or rejects (never hangs
    // silently) so a bad asset shows up as a visible console error instead
    // of just leaving the canvas blank.
    function getSvgImageObject(svgString) {
      if (imageCache.has(svgString)) {
        return Promise.resolve(imageCache.get(svgString));
      }
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
          imageCache.set(svgString, img);
          resolve(img);
        };
        img.onerror = (err) => {
          console.error('SVG asset failed to load as an image:', err, svgString.slice(0, 120));
          reject(new Error('SVG asset failed to load'));
        };
        img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgString);
      });
    }

    // Main render function: Draws layers cleanly onto transparent canvas
    async function renderCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (const layer of layers) {
        if (!layer.imgObj) {
          try {
            layer.imgObj = await getSvgImageObject(layer.svgString);
          } catch (err) {
            console.error('Skipping a layer that failed to render:', err);
            continue;
          }
        }

        ctx.save();
        ctx.translate(layer.x, layer.y);
        ctx.rotate((layer.rotation * Math.PI) / 180);
        ctx.scale(layer.flipX ? -layer.scale : layer.scale, layer.scale);

        const drawWidth = layer.width;
        const drawHeight = layer.height;
        ctx.drawImage(layer.imgObj, -drawWidth / 2, -drawHeight / 2, drawWidth, drawHeight);

        ctx.restore();

        if (layer.id === selectedLayerId) {
          ctx.save();
          ctx.translate(layer.x, layer.y);
          ctx.rotate((layer.rotation * Math.PI) / 180);

          const w = drawWidth * layer.scale;
          const h = drawHeight * layer.scale;

          ctx.strokeStyle = '#171717';
          ctx.lineWidth = 2.5;
          ctx.setLineDash([6, 4]);
          ctx.strokeRect(-w / 2 - 4, -h / 2 - 4, w + 8, h + 8);

          ctx.fillStyle = '#171717';
          ctx.fillRect(-w / 2 - 8, -h / 2 - 8, 8, 8);
          ctx.fillRect(w / 2, -h / 2 - 8, 8, 8);
          ctx.fillRect(-w / 2 - 8, h / 2, 8, 8);
          ctx.fillRect(w / 2, h / 2, 8, 8);

          ctx.restore();
        }
      }
    }

    // Render selection picker buttons with exact vector SVG preview icons
    function renderAssetPickers() {
      const renderGrid = (gridId, assetArray, type) => {
        const grid = document.getElementById(gridId);
        grid.innerHTML = assetArray.map((svg, idx) => `
          <button onclick="addOrReplaceLayer('${type}', ${idx})" class="p-2 bg-neutral-50 hover:bg-neutral-100 hover:border-neutral-400 rounded-xl border border-neutral-200 transition-all hover:scale-105 aspect-square flex items-center justify-center group shadow-2xs">
            <div class="w-full h-full text-neutral-800 group-hover:text-neutral-900 transition-colors flex items-center justify-center">
              ${svg}
            </div>
          </button>
        `).join('');
      };

      renderGrid('gridHead', SVG_ASSETS.heads, 'head');
      renderGrid('gridBody', SVG_ASSETS.bodies, 'body');
      renderGrid('gridSymbol', SVG_ASSETS.symbols, 'symbol');
    }

    // ---- Default placement, expressed as fractions of the canvas size ----
    // Heads and bodies share the same source viewBox width (85.04), so giving
    // them the same on-canvas display width lines the head up with the body's
    // neck opening automatically. These fractions were tuned against the
    // actual artwork (measured neck-opening / chin positions) and are
    // resolution-independent, so they keep working if canvas.width/height
    // are ever changed.
    const FIGURE_WIDTH_FRAC = 0.63;   // head & body display width, as a fraction of canvas width
    const VERTICAL_OFFSET_FRAC = 0.11; // shifts the figure down from dead-center to leave room for the head
    const NECK_OPENING_FRAC = 0.07;   // average neck-opening position within the body artwork
    const CHIN_FRAC = 0.63;           // average chin position within the head artwork

    const FIGURE_WIDTH = canvas.width * FIGURE_WIDTH_FRAC;
    const BODY_HEIGHT = FIGURE_WIDTH * (141.73 / 85.04);
    const HEAD_SIZE = FIGURE_WIDTH;
    const BODY_CENTER_Y = canvas.height * 0.5 + canvas.height * VERTICAL_OFFSET_FRAC;
    const BODY_TOP = BODY_CENTER_Y - BODY_HEIGHT / 2;
    const NECK_TOP = BODY_TOP + BODY_HEIGHT * NECK_OPENING_FRAC;
    const HEAD_CENTER_Y = NECK_TOP - HEAD_SIZE * CHIN_FRAC + HEAD_SIZE / 2;
    const SYMBOL_SIZE = HEAD_SIZE * 0.32;
    const GLASSES_INDEX = SVG_ASSETS.symbols.length - 1; // glasses sit over the face, not beside the head
    const GLASSES_WIDTH = HEAD_SIZE * 0.56;
    const GLASSES_HEIGHT = GLASSES_WIDTH * 0.4;
    const GLASSES_Y = HEAD_CENTER_Y - HEAD_SIZE * 0.03;

    let symbolPlacementCount = 0;

    // Add or replace layer smart functionality
    window.addOrReplaceLayer = async function(type, index) {
      let svgString = '';
      let width = 120;
      let height = 120;
      let x = canvas.width / 2;
      let y = canvas.height / 2;

      if (type === 'head') {
        svgString = SVG_ASSETS.heads[index];
        width = HEAD_SIZE;
        height = HEAD_SIZE;
        x = canvas.width / 2;
        y = HEAD_CENTER_Y;
      } else if (type === 'body') {
        svgString = SVG_ASSETS.bodies[index];
        width = FIGURE_WIDTH;
        height = BODY_HEIGHT;
        x = canvas.width / 2;
        y = BODY_CENTER_Y;
      } else if (type === 'symbol') {
        svgString = SVG_ASSETS.symbols[index];
        if (index === GLASSES_INDEX) {
          // Accessory that belongs ON the face (glasses), not beside the head.
          width = GLASSES_WIDTH;
          height = GLASSES_HEIGHT;
          x = canvas.width / 2;
          y = GLASSES_Y;
        } else {
          width = SYMBOL_SIZE;
          height = SYMBOL_SIZE;
          x = canvas.width / 2 + FIGURE_WIDTH * 0.55 + (symbolPlacementCount % 3) * (SYMBOL_SIZE * 0.2);
          y = (HEAD_CENTER_Y - HEAD_SIZE / 2) + HEAD_SIZE * 0.15 + Math.floor(symbolPlacementCount / 3) * (SYMBOL_SIZE * 0.2);
          symbolPlacementCount++;
        }
      }

      let imgObj;
      try {
        imgObj = await getSvgImageObject(svgString);
      } catch (err) {
        console.error(`Failed to load ${type} asset #${index}:`, err);
        alert('這個素材圖檔載入失敗，請按 F12 打開瀏覽器主控台查看詳細錯誤訊息。');
        return;
      }

      // If replacing an existing modular type (head, body), update it in place.
      // Symbols can be layered multiple times, so they always add a new sticker.
      const existingIdx = layers.findIndex(l => l.type === type);
      if (existingIdx !== -1 && type !== 'symbol') {
        const existingLayer = layers[existingIdx];
        existingLayer.svgString = svgString;
        existingLayer.imgObj = imgObj;
        selectedLayerId = existingLayer.id;
      } else {
        const newLayer = {
          id: Date.now() + Math.random(),
          type, svgString, imgObj, x, y, width, height,
          scale: 1, rotation: 0, flipX: false
        };

        // Logical layer ordering: Body (bottom) -> Head (middle) -> Symbols (top)
        if (type === 'body') {
          layers.unshift(newLayer);
        } else if (type === 'symbol') {
          layers.push(newLayer);
        } else if (type === 'head') {
          const bodyIdx = layers.findIndex(l => l.type === 'body');
          const insertAt = bodyIdx === -1 ? 0 : bodyIdx + 1;
          layers.splice(insertAt, 0, newLayer);
        }

        selectedLayerId = newLayer.id;
      }

      updateTransformUI();
      renderCanvas();
    };

    // Load a default preset character with all layers
    async function loadPresetCharacter() {
      layers = [];
      symbolPlacementCount = 0;
      await addOrReplaceLayer('body', 0);
      await addOrReplaceLayer('head', 0);
      await addOrReplaceLayer('symbol', 0);
      renderCanvas();
    }

    // Shuffle: pick a random head + random body + random accessory each time
    async function loadRandomCharacter() {
      layers = [];
      symbolPlacementCount = 0;
      const randomIndex = (arr) => Math.floor(Math.random() * arr.length);
      await addOrReplaceLayer('body', randomIndex(SVG_ASSETS.bodies));
      await addOrReplaceLayer('head', randomIndex(SVG_ASSETS.heads));
      await addOrReplaceLayer('symbol', randomIndex(SVG_ASSETS.symbols));
      renderCanvas();
    }

    function getCanvasCoordinates(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;

      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;

      return {
        x: (clientX - rect.left) * scaleX,
        y: (clientY - rect.top) * scaleY
      };
    }

    function isPointInLayer(x, y, layer) {
      const w = layer.width * layer.scale;
      const h = layer.height * layer.scale;
      return (
        x >= layer.x - w / 2 &&
        x <= layer.x + w / 2 &&
        y >= layer.y - h / 2 &&
        y <= layer.y + h / 2
      );
    }

    function handlePointerDown(e) {
      const { x, y } = getCanvasCoordinates(e);

      let hitLayer = null;
      for (let i = layers.length - 1; i >= 0; i--) {
        if (isPointInLayer(x, y, layers[i])) {
          hitLayer = layers[i];
          break;
        }
      }

      if (hitLayer) {
        selectedLayerId = hitLayer.id;
        isDragging = true;
        dragStartX = x;
        dragStartY = y;
        initialLayerX = hitLayer.x;
        initialLayerY = hitLayer.y;
      } else {
        selectedLayerId = null;
      }

      updateTransformUI();
      renderCanvas();
    }

    function handlePointerMove(e) {
      if (!isDragging || !selectedLayerId) return;
      e.preventDefault();

      const { x, y } = getCanvasCoordinates(e);
      const dx = x - dragStartX;
      const dy = y - dragStartY;

      const layer = layers.find(l => l.id === selectedLayerId);
      if (layer) {
        layer.x = initialLayerX + dx;
        layer.y = initialLayerY + dy;
        renderCanvas();
      }
    }

    function handlePointerUp() {
      isDragging = false;
    }

    canvas.addEventListener('mousedown', handlePointerDown);
    canvas.addEventListener('mousemove', handlePointerMove);
    window.addEventListener('mouseup', handlePointerUp);

    canvas.addEventListener('touchstart', handlePointerDown, { passive: false });
    canvas.addEventListener('touchmove', handlePointerMove, { passive: false });
    window.addEventListener('touchend', handlePointerUp);

    const scaleInput = document.getElementById('scaleInput');
    const rotateInput = document.getElementById('rotateInput');
    const scaleValueText = document.getElementById('scaleValueText');
    const rotateValueText = document.getElementById('rotateValueText');
    const transformControls = document.getElementById('transformControls');
    const selectedLayerLabel = document.getElementById('selectedLayerLabel');

    function updateTransformUI() {
      const layer = layers.find(l => l.id === selectedLayerId);
      if (layer) {
        transformControls.classList.remove('opacity-40', 'pointer-events-none');
        scaleInput.value = layer.scale;
        rotateInput.value = layer.rotation;
        scaleValueText.textContent = `${Math.round(layer.scale * 100)}%`;
        rotateValueText.textContent = `${layer.rotation}°`;

        const typeNames = { head: '頭', body: '身', symbol: '配件' };
        selectedLayerLabel.textContent = `已選取：${typeNames[layer.type] || '元件'}`;
      } else {
        transformControls.classList.add('opacity-40', 'pointer-events-none');
        selectedLayerLabel.textContent = '未選取元件';
      }
    }

    scaleInput.addEventListener('input', (e) => {
      const layer = layers.find(l => l.id === selectedLayerId);
      if (layer) {
        layer.scale = parseFloat(e.target.value);
        scaleValueText.textContent = `${Math.round(layer.scale * 100)}%`;
        renderCanvas();
      }
    });

    rotateInput.addEventListener('input', (e) => {
      const layer = layers.find(l => l.id === selectedLayerId);
      if (layer) {
        layer.rotation = parseInt(e.target.value, 10);
        rotateValueText.textContent = `${layer.rotation}°`;
        renderCanvas();
      }
    });

    document.getElementById('flipBtn').addEventListener('click', () => {
      const layer = layers.find(l => l.id === selectedLayerId);
      if (layer) {
        layer.flipX = !layer.flipX;
        renderCanvas();
      }
    });

    document.getElementById('centerElementBtn').addEventListener('click', () => {
      const layer = layers.find(l => l.id === selectedLayerId);
      if (layer) {
        layer.x = canvas.width / 2;
        renderCanvas();
      }
    });

    document.getElementById('deleteElementBtn').addEventListener('click', () => {
      if (selectedLayerId) {
        layers = layers.filter(l => l.id !== selectedLayerId);
        selectedLayerId = null;
        updateTransformUI();
        renderCanvas();
      }
    });

    document.getElementById('clearAllBtn').addEventListener('click', () => {
      layers = [];
      selectedLayerId = null;
      updateTransformUI();
      renderCanvas();
    });

    document.getElementById('layerUpBtn').addEventListener('click', () => {
      const idx = layers.findIndex(l => l.id === selectedLayerId);
      if (idx !== -1 && idx < layers.length - 1) {
        const temp = layers[idx];
        layers[idx] = layers[idx + 1];
        layers[idx + 1] = temp;
        renderCanvas();
      }
    });

    document.getElementById('layerDownBtn').addEventListener('click', () => {
      const idx = layers.findIndex(l => l.id === selectedLayerId);
      if (idx > 0) {
        const temp = layers[idx];
        layers[idx] = layers[idx - 1];
        layers[idx - 1] = temp;
        renderCanvas();
      }
    });

    function initTabs() {
      const tabs = [
        { btn: document.getElementById('tabHead'), grid: document.getElementById('gridHead') },
        { btn: document.getElementById('tabBody'), grid: document.getElementById('gridBody') },
        { btn: document.getElementById('tabSymbol'), grid: document.getElementById('gridSymbol') }
      ];

      tabs.forEach(({ btn, grid }) => {
        btn.addEventListener('click', () => {
          tabs.forEach(t => {
            t.btn.classList.remove('text-neutral-900', 'border-neutral-900');
            t.btn.classList.add('text-neutral-400', 'border-transparent');
            t.grid.classList.add('hidden');
          });

          btn.classList.add('text-neutral-900', 'border-neutral-900');
          btn.classList.remove('text-neutral-400', 'border-transparent');
          grid.classList.remove('hidden');
        });
      });
    }

    const exportModal = document.getElementById('exportModal');
    const exportModalCard = document.getElementById('exportModalCard');
    const exportedImage = document.getElementById('exportedImage');
    const downloadLink = document.getElementById('downloadLink');

    document.getElementById('exportBtn').addEventListener('click', async () => {
      const tempSelected = selectedLayerId;
      selectedLayerId = null;
      await renderCanvas();

      const dataUrl = canvas.toDataURL('image/png');
      exportedImage.src = dataUrl;
      downloadLink.href = dataUrl;

      selectedLayerId = tempSelected;
      await renderCanvas();

      exportModal.classList.remove('hidden');
      setTimeout(() => {
        exportModal.classList.remove('opacity-0');
        exportModalCard.classList.remove('scale-95');
        exportModalCard.classList.add('scale-100');
      }, 10);
    });

    function closeModal() {
      exportModal.classList.add('opacity-0');
      exportModalCard.classList.remove('scale-100');
      exportModalCard.classList.add('scale-95');
      setTimeout(() => {
        exportModal.classList.add('hidden');
      }, 300);
    }

    document.getElementById('closeModalBtn').addEventListener('click', closeModal);
    exportModal.addEventListener('click', (e) => {
      if (e.target === exportModal) closeModal();
    });

    document.getElementById('resetCanvasBtn').addEventListener('click', () => {
      loadPresetCharacter();
    });

    document.getElementById('addPresetCharacterBtn').addEventListener('click', () => {
      loadRandomCharacter();
    });

    window.onload = async () => {
      updateHeaderHeightVar();
      renderAssetPickers();
      initTabs();
      await loadPresetCharacter();
    };

  </script>
</body>
</html>
